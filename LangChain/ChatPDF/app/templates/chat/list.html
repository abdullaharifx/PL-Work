{% if Chats.items %}
    <div class="row">
        {% for chat in Chats.items %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ chat.title }}</h5>
                    <p class="card-text">{{ chat.description }}</p>
                    <p class="text-muted small">
                        <i class="fas fa-calendar"></i> {{ chat.created_at.strftime('%B %d, %Y') }}
                    </p>
                </div>
                <div class="card-footer">
                    <div class="btn-group w-100" role="group">
                        <a href="{{ url_for('chat_controller.view_chat', username = chat.user.username, chat_id=chat.id) }}" class="btn btn-primary">
                            <i class="fas fa-comments"></i> Open
                        </a>
                        <a href="{{ url_for('chat.edit_view', chat_id=chat.id) }}" class="btn btn-outline-secondary">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <a href="{{ url_for('delete.delete_view', chat_id=chat.id) }}" class="btn btn-outline-danger">
                            <i class="fas fa-trash"></i> Delete
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% else %}
    <div class="text-center py-5">
        <i class="fas fa-comments fa-5x text-muted mb-3"></i>
        <h4 class="text-muted">No chats found</h4>
        <p>You haven't created any chats yet.</p>
        <a href="{{ url_for('create.create_view') }}" class="btn btn-success">
            <i class="fas fa-plus"></i> Create Your First Chat
        </a>
    </div>
{% endif %}
