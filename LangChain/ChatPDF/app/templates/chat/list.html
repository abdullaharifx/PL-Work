{% for todo in todos.items %}
    <div class="card mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
                <div class="w-100 pe-3">
                    <h5 class="card-title">{{ todo.title }}</h5>
                    <small class="text-muted">
                        <i class="fas fa-clock"></i> 
                        Created: {{ todo.created_at.strftime('%Y-%m-%d %H:%M') }}
                    </small>
                </div>
                <div class="btn-group">
                    <button class="btn btn-sm btn-outline-info" 
                            data-bs-toggle="collapse" 
                            data-bs-target="#collapse-{{ todo.id }}" 
                            aria-expanded="false" 
                            aria-controls="collapse-{{ todo.id }}">
                        <i class="fas fa-eye"></i> View
                    </button>
                    <a href="{{ url_for('edit.edit_view', todo_id=todo.id) }}" 
                       class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <a href="{{ url_for('delete.delete_view', todo_id=todo.id) }}" 
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Are you sure you want to delete this todo?')">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </div>
            </div>

            <!-- Collapsible Description Section -->
            <div id="collapse-{{ todo.id }}" class="collapse mt-3">
                <div class="card-text" style="white-space: pre-wrap; word-wrap: break-word;">
                    {{ todo.description }}
                </div>
            </div>
        </div>
    </div>
{% endfor %}
