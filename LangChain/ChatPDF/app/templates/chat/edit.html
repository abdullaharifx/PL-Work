{% extends "base.html" %}

{% block title %}Edit Chat - ChatPDF{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-edit"></i> Edit Chat</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" 
                               value="{{ chat.title }}" maxlength="50" required>
                        <div class="form-text">Maximum 50 characters</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Custom Prompt</label>
                        <textarea class="form-control" id="description" name="description" 
                                  rows="4" maxlength="150" required>{{ chat.description }}</textarea>
                        <div class="form-text">Maximum 150 characters</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="llm_model" class="form-label">Model</label>
                        <select class="form-select" id="llm_model" name="llm_model" required>
                            <option value="qwen3-32b" {% if chat.llm_model == 'qwen3-32b' %}selected{% endif %}>Qwen3-32B</option>
                            <option value="gemini-2.5-flash" {% if chat.llm_model == 'gemini-2.5-flash' %}selected{% endif %}>Gemini 2.5 Flash</option>
                        </select>
                        <div class="form-text">Select the AI model for this chat session.</div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Chat
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
