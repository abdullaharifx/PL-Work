{% extends "base.html" %}

{% block title %}Upload PDFs{% endblock %}

{% block content %}
    <h1 class="mb-4">Upload PDFs</h1>

    <form action="{{ url_for('file_upload.upload_file') }}" method="POST" enctype="multipart/form-data">
        <!-- use the chat_id passed from the view (not request.args) -->
        <input type="hidden" name="chat_id" value="{{ chat_id }}" />

        <div class="mb-3">
            <label for="pdf_file" class="form-label">Choose files</label>
            <!-- NAME changed to 'pdf_file' (matches Flask) and 'multiple' kept -->
            <input type="file"
                   class="form-control"
                   id="pdf_file"
                   name="pdf_file"
                   accept=".pdf,.docx,.txt"
                   multiple
                   required />
        </div>

        <button type="submit" class="btn btn-primary">Upload</button>
    </form>
{% endblock %}
