<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ChatPDF App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Navigation Import NavBar -->
    {% include './layout/navbar.html' %}

    <!-- Flash Messages -->
    {% include './layout/flash_msgs.html' %}

    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<script>
// ✅ Global function to fix all timestamps
function fixTimestamps() {
    // Find all elements with time patterns
    const timeElements = document.querySelectorAll('.small:contains(":")');
    
    timeElements.forEach(element => {
        const text = element.textContent.trim();
        const timeMatch = text.match(/(\d{1,2}):(\d{2})/);
        
        if (timeMatch) {
            // Create a date object for today with the UTC time
            const now = new Date();
            const utcDate = new Date(Date.UTC(
                now.getUTCFullYear(), 
                now.getUTCMonth(), 
                now.getUTCDate(),
                parseInt(timeMatch[1]), 
                parseInt(timeMatch[2])
            ));
            
            // Convert to local time
            const localTime = utcDate.toLocaleTimeString([], {
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false
            });
            
            element.textContent = localTime;
        }
    });
}

// Run on page load and after HTMX swaps
document.addEventListener('DOMContentLoaded', fixTimestamps);
document.body.addEventListener('htmx:afterSwap', fixTimestamps);
</script>
